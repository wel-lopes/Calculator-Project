<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="calculadora">
            <input type="text" id="display">
            <div class="botoes">
                <button onclick="limpar()" data-tecla="Del">C</button>
                <button onclick="adicionar('/')"data-tecla="/">/</button>
                <button onclick="adicionar('*')" data-tecla="*">*</button>
                <button onclick="removerUltimo()" data-tecla='Backspace'>←</button>
                <button onclick="adicionar('7')" data-tecla="7">7</button>
                <button onclick="adicionar('8')" data-tecla="8">8</button>
                <button onclick="adicionar('9')" data-tecla="9">9</button>
                <button onclick="adicionar('-')" data-tecla="-">-</button>
                <button onclick="adicionar('4')" data-tecla="4">4</button>
                <button onclick="adicionar('5')" data-tecla="5">5</button>
                <button onclick="adicionar('6')" data-tecla="6">6</button>
                <button onclick="adicionar('+')" data-tecla="+">+</button>
                <button onclick="adicionar('1')" data-tecla="1">1</button>
                <button onclick="adicionar('2')" data-tecla="2">2</button>
                <button onclick="adicionar('3')" data-tecla="3">3</button>
                <button onclick="calcular()" data-tecla="Enter">=</button>
                <button onclick="adicionar('0')" class="zero" data-tecla="0">0</button>
                <button onclick="adicionar('.')" data-tecla=",">.</button>
            </div>
        </div>
    </header>
    <script src="script.js"></script>
</body>
</html>
